<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 레이아웃 측정</title>
<style>
  body{margin:0;font-family:"Malgun Gothic",sans-serif;background:#2b2b2b;color:#fff}
  .row{display:flex;gap:14px;padding:14px;align-items:flex-start}
  .col{display:grid;row-gap:6px}
  .lab{font-size:13px;font-weight:700}
  iframe{border:0;background:#fff;display:block}
  #out{padding:14px;font-size:15px;line-height:1.7;white-space:pre;font-family:Consolas,monospace}
  .ok{color:#6ee7b7}.bad{color:#fca5a5}
</style>
</head>
<body>
<div id="out">측정 중…</div>
<div class="row">
  <div class="col"><span class="lab">360px</span><iframe id="f360" width="360" height="1500" src="../build/index.html#서울특별시/관악구"></iframe></div>
  <div class="col"><span class="lab">390px</span><iframe id="f390" width="390" height="1500" src="../build/index.html#서울특별시/관악구"></iframe></div>
</div>
<script>
/* 각 폭에서 가로 넘침이 있는지 iframe 내부를 직접 재서 숫자로 뽑는다.
   눈으로 스크린샷만 보면 헤드리스 뷰포트 착시와 구분이 안 된다.
   file:// 교차 접근이 필요하므로 --allow-file-access-from-files 로 띄울 것. */
function measure(id, w){
  const d = document.getElementById(id).contentDocument;
  if(!d) return id + ': 접근 실패 (--allow-file-access-from-files 필요)';
  const de = d.documentElement, b = d.body;
  const scrollW = Math.max(de.scrollWidth, b.scrollWidth);
  const over = scrollW - w;
  // 뷰포트보다 오른쪽으로 삐져나간 요소를 실제로 찾아낸다
  const bad = [];
  d.querySelectorAll('*').forEach(el=>{
    const r = el.getBoundingClientRect();
    if(r.width > 0 && r.right > w + 1){
      bad.push((el.tagName.toLowerCase()) + (el.className? '.'+String(el.className).split(' ')[0] : '')
               + ' right=' + r.right.toFixed(0));
    }
  });
  // 미디어쿼리가 실제로 걸렸는지 (480px 이하에서 시도/시군구가 세로로 서야 함)
  const pick = d.querySelector('.pick');
  const cols = pick ? d.defaultView.getComputedStyle(pick).gridTemplateColumns.split(' ').length : 0;
  const h1 = d.querySelector('h1');
  const h1size = h1 ? d.defaultView.getComputedStyle(h1).fontSize : '?';
  const cards = d.querySelectorAll('#list li').length;
  const chips = d.querySelectorAll('.chip.gr').length;
  const lines = [];
  lines.push('[' + w + 'px]');
  lines.push('  scrollWidth      ' + scrollW + (over > 1 ? '   ### 가로 넘침 ' + over + 'px' : '   가로 넘침 없음'));
  lines.push('  .pick 열 수      ' + cols + (cols === 1 ? '  (세로 1열 — 모바일 규칙 적용됨)' : '  ### 모바일 규칙 미적용'));
  lines.push('  h1 글자          ' + h1size);
  lines.push('  카드 수          ' + cards + ' · 평가등급 배지 ' + chips);
  lines.push('  삐져나간 요소    ' + (bad.length ? bad.length + '개 → ' + bad.slice(0,6).join(' | ') : '없음'));
  return lines.join('\n');
}
window.addEventListener('load', ()=>{
  setTimeout(()=>{
    const t = [measure('f360',360), measure('f390',390)].join('\n\n');
    const el = document.getElementById('out');
    el.textContent = t;
    el.className = /###/.test(t) ? 'bad' : 'ok';
  }, 1200);
});
</script>
</body>
</html>
